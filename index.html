<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chrono renforcement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une colonne étroite, trois vues (programme, séance, fin).
   En séance, tout l'écran prend la couleur de la phase : bleu pour l'effort, vert pour le repos. */
:root {
  --bg: #E9EEF1;
  --surface: #FFFFFF;
  --ink: #0F1A24;
  --muted: #566876;
  --line: #D2DBE1;
  --line-strong: #97A7B3;
  --hover: #EDF1F4;
  --effort: #2547D9;
  --effort-ink: #FFFFFF;
  --stage-effort: #2547D9;
  --stage-rest: #0F7F63;
  --stage-done: #0F1A24;
  --stage-ink: #FFFFFF;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1118;
    --surface: #151E28;
    --ink: #E7EDF2;
    --muted: #93A4B2;
    --line: #263444;
    --line-strong: #4B5D6D;
    --hover: #1E2A36;
    --effort: #7D95FF;
    --effort-ink: #0B1118;
    --stage-effort: #2F4FE0;
    --stage-done: #1B2835;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1118;
  --surface: #151E28;
  --ink: #E7EDF2;
  --muted: #93A4B2;
  --line: #263444;
  --line-strong: #4B5D6D;
  --hover: #1E2A36;
  --effort: #7D95FF;
  --effort-ink: #0B1118;
  --stage-effort: #2F4FE0;
  --stage-done: #1B2835;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  transition: background-color .35s ease;
}
body[data-mode="run"][data-phase="work"] { background: var(--stage-effort); }
body[data-mode="run"][data-phase="rest"] { background: var(--stage-rest); }
body[data-mode="done"] { background: var(--stage-done); }
body[data-mode="run"], body[data-mode="done"] { color: var(--stage-ink); }

.app {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--effort); outline-offset: 2px; }
body[data-mode="run"] button:focus-visible, body[data-mode="done"] button:focus-visible { outline-color: var(--stage-ink); }

/* Vue programme */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 2.2rem;
  line-height: 1;
  letter-spacing: .02em;
  text-transform: uppercase;
  text-wrap: balance;
}
.pill {
  flex: none;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  border-radius: 99px;
  background: transparent;
  color: var(--ink);
  font-size: .85rem;
  font-weight: 600;
}
.pill[aria-pressed="false"] { color: var(--muted); }
.summary { margin: 8px 0 18px; color: var(--muted); font-variant-numeric: tabular-nums; }

#list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 14px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 2px; }
.ex-head { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; }
.ex-idx { flex: none; min-width: 1.1em; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-name {
  flex: 1; min-width: 0;
  padding: 8px 2px;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  background: transparent; color: var(--ink);
  font: 600 1.05rem var(--font-body);
}
.ex-name::placeholder { color: var(--muted); font-weight: 400; }
.tools { flex: none; display: flex; gap: 2px; }
.tbtn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.tbtn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.tbtn:disabled { opacity: .3; cursor: default; }
.tbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.field > div:first-child { min-width: 0; }
.field label { display: block; font-weight: 600; }
.sub { display: block; font-size: .8rem; color: var(--muted); }
.stepper { flex: none; display: grid; grid-template-columns: 44px 64px 44px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { height: 44px; border: 0; background: var(--hover); color: var(--ink); font-size: 1.4rem; line-height: 1; }
.stepper button:active { background: var(--line); }
.stepper input {
  width: 100%; height: 44px; padding: 0;
  border: 0; border-radius: 0; text-align: center;
  background: var(--surface); color: var(--ink);
  font: 600 1.6rem var(--font-display);
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.add {
  width: 100%; min-height: 48px; margin-top: 12px;
  border: 1.5px dashed var(--line-strong); border-radius: 12px;
  background: transparent; color: var(--ink); font-weight: 600;
}
.add:hover { background: var(--hover); }
.setup { margin-bottom: 12px; padding: 12px 14px 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 44px; border: 0; background: var(--hover); color: var(--ink); font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--effort); color: var(--effort-ink); }
.setup > .sub { margin: 10px 0 12px; }
#list[data-org="circuit"] .field-sets { display: none; }
.history { margin-top: 28px; }
.history h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; letter-spacing: .04em; text-transform: uppercase; }
#hist-list { list-style: none; margin: 0; padding: 0; }
.hist { padding: 12px 0; border-top: 1px solid var(--line); }
.hist-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.hist-date { font-weight: 600; text-transform: capitalize; }
.hist-dur { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.hist-sub, .hist-names { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.hist-empty { padding: 12px 0; border-top: 1px solid var(--line); color: var(--muted); }
.save-note { margin: 10px 0 0; font-size: .9rem; opacity: .85; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .9rem; }
.status button { border: 0; background: transparent; color: var(--effort); font-weight: 700; padding: 6px 4px; }

.startbar { position: sticky; bottom: 0; margin-top: 16px; padding-block: 12px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.start {
  width: 100%; min-height: 56px;
  border: 0; border-radius: 14px;
  background: var(--effort); color: var(--effort-ink);
  font-size: 1.1rem; font-weight: 700; letter-spacing: .01em;
}
.start:disabled { opacity: .4; cursor: default; }

/* Vues séance et fin */
.stage {
  display: flex; flex-direction: column; justify-content: space-between; gap: 20px;
  min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 48px);
}
.stage-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .95rem; font-weight: 500; }
.ghost {
  min-height: 40px; padding: 0 16px;
  border: 1.5px solid color-mix(in srgb, var(--stage-ink) 55%, transparent);
  border-radius: 99px; background: transparent; color: var(--stage-ink); font-weight: 600; font-size: .9rem;
}
.phase { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
.run-name { margin: 6px 0 4px; font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 9vw, 3.2rem); line-height: 1.05; text-wrap: balance; overflow-wrap: anywhere; }
.run-set { margin: 0; font-size: 1.05rem; opacity: .92; }
.clock { margin: 6px 0 14px; font-family: var(--font-display); font-weight: 700; font-size: clamp(6rem, 34vw, 11rem); line-height: .95; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--stage-ink) 25%, transparent); }
.bar span { display: block; width: 100%; height: 100%; background: var(--stage-ink); transform-origin: left center; transform: scaleX(0); }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0; font-size: .95rem; opacity: .92; font-variant-numeric: tabular-nums; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sbtn { min-height: 64px; padding: 0 12px; border: 2px solid var(--stage-ink); border-radius: 14px; background: transparent; color: var(--stage-ink); font-size: 1.05rem; font-weight: 700; }
.sbtn.primary { background: var(--stage-ink); }
body[data-phase="work"] .sbtn.primary { color: var(--stage-effort); }
body[data-phase="rest"] .sbtn.primary { color: var(--stage-rest); }
body[data-mode="done"] .sbtn.primary { color: var(--stage-done); }
.done-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(2.4rem, 12vw, 4rem); line-height: 1; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  body { transition: none; }
}
.account { padding-bottom: 12px; }
.account .sub { margin: 0 0 10px; }
.login-row { display: flex; gap: 8px; flex-wrap: wrap; }
.login-row input { flex: 1 1 200px; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
.login-row .pill { min-height: 44px; }
.acc-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.acc-in .sub { display: block; margin: 0; }
.acc-mail { display: block; font-weight: 600; overflow-wrap: anywhere; }
</style>

</head>
<body>
<div class="app">
  <main id="view-edit">
    <div class="top">
      <h1>Chrono renforcement</h1>
      <button id="sound-btn" class="pill" type="button" aria-pressed="true">Son activé</button>
    </div>
    <section id="account" class="setup account" aria-label="Compte">
      <div id="acc-out">
        <p class="sub">Connecte-toi pour garder ton programme et ton historique en ligne, sur tous tes appareils.</p>
        <form id="login-form" class="login-row">
          <input id="login-email" type="email" inputmode="email" autocomplete="email" placeholder="ton@email.fr" aria-label="Adresse e-mail" required>
          <button id="login-btn" class="pill" type="submit">Recevoir le lien</button>
        </form>
        <p id="login-msg" class="sub" role="status"></p>
      </div>
      <div id="acc-in" class="acc-in" hidden>
        <span><span class="sub">Connecté</span><span id="acc-mail" class="acc-mail"></span></span>
        <button id="logout-btn" class="pill" type="button">Se déconnecter</button>
      </div>
    </section>
    <p id="summary" class="summary"></p>
    <section id="setup" class="setup" aria-label="Organisation de la séance">
      <div id="seg" class="seg" role="radiogroup" aria-label="Organisation de la séance">
        <button type="button" role="radio" aria-checked="true" data-mode="exercise">Par exercice</button>
        <button type="button" role="radio" aria-checked="false" data-mode="circuit">En circuit</button>
      </div>
      <p id="mode-help" class="sub"></p>
      <div id="circuit-fields" hidden></div>
    </section>
    <ol id="list"></ol>
    <p id="status" class="status" role="status" hidden><span id="status-text"></span><button id="undo-btn" type="button">Annuler</button></p>
    <button id="add-btn" class="add" type="button">+ Ajouter un exercice</button>
    <section class="history" aria-labelledby="hist-title">
      <h2 id="hist-title">Séances faites</h2>
      <ul id="hist-list"></ul>
    </section>
    <div class="startbar"><button id="start-btn" class="start" type="button">Démarrer la séance</button></div>
  </main>

  <section id="view-run" class="stage" hidden>
    <div class="stage-top">
      <button id="stop-btn" class="ghost" type="button">Arrêter</button>
      <span id="progress-text"></span>
    </div>
    <div>
      <p id="phase-label" class="phase"></p>
      <h2 id="run-name" class="run-name"></h2>
      <p id="run-set" class="run-set"></p>
      <div id="clock" class="clock" role="timer" aria-live="off">00:00</div>
      <div id="bar" class="bar"><span id="bar-fill"></span></div>
    </div>
    <p class="meta"><span id="next-text"></span><span>Écoulé <span id="total">00:00</span></span></p>
    <div class="controls">
      <button id="pause-btn" class="sbtn primary" type="button">Pause</button>
      <button id="skip-btn" class="sbtn" type="button">Série faite</button>
    </div>
  </section>

  <section id="view-done" class="stage" hidden>
    <div></div>
    <div>
      <p class="phase">Bien joué</p>
      <h2 class="done-title">Séance terminée</h2>
      <div id="done-time" class="clock">00:00</div>
      <p id="done-detail" class="run-set"></p>
      <p id="done-save" class="save-note" role="status"></p>
    </div>
    <div class="controls">
      <button id="again-btn" class="sbtn primary" type="button">Refaire la séance</button>
      <button id="back-btn" class="sbtn" type="button">Modifier le programme</button>
    </div>
  </section>
</div>

<script>
/* À REMPLIR : adresse du projet et clé publique (anon / publishable) trouvées dans Supabase > Project Settings > API. Jamais la clé secrète. */
window.CHRONO_CONFIG = { url: 'https://iatqcsbqdqkqxhfiwpuc.supabase.co', key: 'sb_publishable_MGuORmnAN2-y7Tq53y-HPA_Oxr9HG2a' };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var KEY = 'chrono-renforcement-v1';
  var LIM = { sets: [1, 20], work: [0, 900], rest: [0, 900], rounds: [1, 20], roundRest: [0, 900] };
  var STEP = { sets: 1, work: 5, rest: 5, rounds: 1, roundRest: 5 };
  var FREE_SET_GUESS = 40;

  var EXAMPLE = [
    { name: 'Pompes · 12 reps', sets: 3, work: 0, rest: 60 },
    { name: 'Squats · 20 reps', sets: 3, work: 0, rest: 60 },
    { name: 'Planche', sets: 3, work: 30, rest: 60 },
    { name: 'Fentes avant · 12 reps par jambe', sets: 3, work: 0, rest: 60 },
    { name: 'Mountain climbers', sets: 3, work: 30, rest: 60 }
  ];

  var org = 'exercise', rounds = 3, roundRest = 90;
  var nextId = 1, exs = [], sound = true, run = null, timerId = null, actx = null, wl = null;
  var lastDeleted = null, statusTimer = null, stopTimer = null;

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function toInt(v, d) { var n = parseInt(v, 10); return isNaN(n) ? d : n; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sanitize(e) {
    return {
      id: nextId++,
      name: String(e && e.name || '').slice(0, 60),
      sets: clamp(toInt(e && e.sets, 3), LIM.sets[0], LIM.sets[1]),
      work: clamp(toInt(e && e.work, 0), LIM.work[0], LIM.work[1]),
      rest: clamp(toInt(e && e.rest, 60), LIM.rest[0], LIM.rest[1])
    };
  }
  function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function fmtDur(s) { return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min' + (s % 60 ? ' ' + (s % 60) + ' s' : ''); }
  function exName(i) { return (exs[i].name || '').trim() || 'Exercice ' + (i + 1); }

  function load() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (saved && Array.isArray(saved.exs)) {
      exs = saved.exs.map(sanitize);
      sound = saved.sound !== false;
      org = saved.org === 'circuit' ? 'circuit' : 'exercise';
      rounds = clamp(toInt(saved.rounds, 3), LIM.rounds[0], LIM.rounds[1]);
      roundRest = clamp(toInt(saved.roundRest, 90), LIM.roundRest[0], LIM.roundRest[1]);
    } else {
      exs = EXAMPLE.map(sanitize);
    }
  }
  var edited = false, progTimer = null, progBusy = false, progDirty = false;
  function persistLocal() {
    try { localStorage.setItem(KEY, JSON.stringify({ exs: exs, sound: sound, org: org, rounds: rounds, roundRest: roundRest })); } catch (e) {}
  }
  function save() { persistLocal(); edited = true; scheduleProgramSave(); }

  /* ---------- Vue programme ---------- */
  var ICON = {
    up: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
    del: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };
  function subText(ex, f) {
    if (f === 'sets') return 'Nombre de séries';
    if (f === 'work') return ex.work === 0 ? 'Libre : tu valides toi-même' : 'Durée de chaque série, en secondes';
    return ex.rest === 0 ? 'Pas de repos' : 'Repos entre séries, en secondes';
  }
  function fieldHTML(ex, f, label) {
    return '<div class="field' + (f === 'sets' ? ' field-sets' : '') + '"><div><label for="' + f + '-' + ex.id + '">' + label + '</label><span class="sub" data-sub="' + f + '">' + subText(ex, f) + '</span></div>' +
      '<div class="stepper"><button type="button" data-act="dec" data-f="' + f + '" aria-label="Diminuer ' + label.toLowerCase() + '">−</button>' +
      '<input id="' + f + '-' + ex.id + '" type="number" inputmode="numeric" step="1" min="' + LIM[f][0] + '" max="' + LIM[f][1] + '" value="' + ex[f] + '" data-f="' + f + '">' +
      '<button type="button" data-act="inc" data-f="' + f + '" aria-label="Augmenter ' + label.toLowerCase() + '">+</button></div></div>';
  }
  function renderList() {
    var list = $('#list');
    list.dataset.org = org;
    if (!exs.length) {
      list.innerHTML = '<li class="empty">Aucun exercice pour l’instant. Ajoute le premier ci-dessous.</li>';
    } else {
      list.innerHTML = exs.map(function (ex, i) {
        return '<li class="ex" data-id="' + ex.id + '">' +
          '<div class="ex-head"><span class="ex-idx">' + (i + 1) + '</span>' +
          '<input id="name-' + ex.id + '" class="ex-name" type="text" maxlength="60" placeholder="Nom de l’exercice" aria-label="Nom de l’exercice ' + (i + 1) + '" value="' + esc(ex.name) + '" data-f="name">' +
          '<div class="tools">' +
          '<button class="tbtn" type="button" data-act="up" aria-label="Monter"' + (i === 0 ? ' disabled' : '') + '>' + ICON.up + '</button>' +
          '<button class="tbtn" type="button" data-act="down" aria-label="Descendre"' + (i === exs.length - 1 ? ' disabled' : '') + '>' + ICON.down + '</button>' +
          '<button class="tbtn" type="button" data-act="del" aria-label="Supprimer">' + ICON.del + '</button>' +
          '</div></div>' +
          fieldHTML(ex, 'sets', 'Séries') + fieldHTML(ex, 'work', 'Chrono') + fieldHTML(ex, 'rest', 'Repos') +
          '</li>';
      }).join('');
    }
    updateSummary();
  }
  function estimateSeconds() {
    var t = 0, n = exs.length;
    if (org === 'circuit' && n) {
      var round = 0;
      exs.forEach(function (ex, i) { round += (ex.work > 0 ? ex.work : FREE_SET_GUESS) + (i < n - 1 ? ex.rest : 0); });
      return Math.max(0, round * rounds + roundRest * (rounds - 1));
    }
    exs.forEach(function (ex) { t += ex.sets * (ex.work > 0 ? ex.work : FREE_SET_GUESS) + ex.sets * ex.rest; });
    if (exs.length) t -= exs[exs.length - 1].rest;
    return Math.max(0, t);
  }
  function updateSummary() {
    var n = exs.length, s = exs.reduce(function (a, e) { return a + e.sets; }, 0);
    $('#summary').textContent = n

      if (rem <= 0) { beep('end'); next(true); return; }
      var s = Math.ceil(rem / 1000);
      $('#clock').textContent = fmt(s);
      $('#bar-fill').style.transform = 'scaleX(' + Math.min(1, el / D) + ')';
      if (s !== run.lastSec) { run.lastSec = s; if (s <= 3) beep('tick'); }
    }
    $('#total').textContent = fmt(Math.floor((now - run.total0) / 1000));
  }
  function next(quiet) {
    if (!run) return;
    if (run.idx + 1 >= run.steps.length) finish(); else startStep(run.idx + 1, quiet === true);
  }
  function togglePause() {
    if (!run) return;
    var now = performance.now();
    if (!run.paused) { run.paused = true; run.pausedAt = now; }
    else { var d = now - run.pausedAt; run.t0 += d; run.total0 += d; run.paused = false; }
    renderPause();
  }
  function finish() {
    var totalMs = performance.now() - run.total0;
    clearInterval(timerId); timerId = null; releaseWake();
    var circ = org === 'circuit';
    var sets = circ ? rounds : exs.reduce(function (a, e) { return a + e.sets; }, 0);
    run = null;
    $('#done-time').textContent = fmt(Math.floor(totalMs / 1000));
    $('#done-detail').textContent = exs.length + ' exercice' + (exs.length > 1 ? 's' : '') + ' · ' + sets + (circ ? ' tour' : ' série') + (sets > 1 ? 's' : '') + ' · temps total';
    setMode('done');
    saveSession(totalMs);
    beep('doneA'); setTimeout(function () { beep('doneB'); }, 220);
  }
  function stopWorkout() {
    clearInterval(timerId); timerId = null; releaseWake(); run = null;
    setMode('edit');
  }

  $('#start-btn').addEventListener('click', startWorkout);
  $('#pause-btn').addEventListener('click', togglePause);
  $('#skip-btn').addEventListener('click', function () { next(); });
  $('#again-btn').addEventListener('click', startWorkout);
  $('#back-btn').addEventListener('click', function () { setMode('edit'); });
  $('#stop-btn').addEventListener('click', function () {
    if (!run) return;
    if (!run.stopArmed) {
      run.stopArmed = true;
      $('#stop-btn').textContent = 'Confirmer l’arrêt';
      clearTimeout(stopTimer);
      stopTimer = setTimeout(function () { if (run) { run.stopArmed = false; $('#stop-btn').textContent = 'Arrêter'; } }, 3500);
    } else {
      clearTimeout(stopTimer); stopWorkout();
    }
  });

  load();
  paintSound();
  renderSetup();
  renderList();
  loadSessions();
  setMode('edit');
  initAuth();
})();
</script>

</body>
</html>
